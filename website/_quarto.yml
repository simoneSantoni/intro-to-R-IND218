project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "IND215 - Introduction to R"
  description: "MSc Module on R Programming for Analytics - Learn R fundamentals and the tidyverse for data wrangling and statistical computing"
  site-url: https://simonesantoni.github.io/intro-to-R-IND215
  repo-url: https://github.com/simoneSantoni/intro-to-R-IND215

  page-navigation: true

  page-footer:
    left: |
      &copy; 2025 Simone Santoni
    center: |
      [IND215 - Introduction to R](https://github.com/simoneSantoni/intro-to-R-IND215)
    right: |
      Made with [Quarto](https://quarto.org/)

  sidebar:
    style: docked
    search: true
    logo: imgs/r-module-icon-light.svg
    #title: "IND216"
    tools:
      - icon: github
        href: https://github.com/simoneSantoni/intro-to-R-IND215
        text: "Repository"
      - icon: pencil-square
        href: https://github.com/simoneSantoni/intro-to-R-IND215/edit/master/{{< meta quarto:source >}}
        text: "Edit this page"
      - icon: bug
        href: https://github.com/simoneSantoni/intro-to-R-IND215/issues/new
        text: "Report an issue"
    contents:
      - section: "Course Information"
        contents:
          - text: "Syllabus"
            href: course/syllabus.qmd
          - text: "Schedule"
            href: course/schedule.qmd
          - text: "Support"
            href: course/support.qmd
          - text: "Teaching team"
            href: course/team.qmd

      - section: "Module 1: Getting Started with R"
        contents:
          - text: "Installing R and RStudio"
            href: modules/module-1/installing-r.qmd
          - text: "R as a Calculator"
            href: modules/module-1/r-as-calculator.qmd
          - text: "RStudio Interface"
            href: modules/module-1/rstudio-interface.qmd
          - text: "R Scripts and Projects"
            href: modules/module-1/r-scripts-projects.qmd

      - section: "Module 2: R Fundamentals"
