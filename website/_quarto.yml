          - text: "Overview"
            href: modules/module-2/index.qmd
          - text: "Data Types and Objects"
            href: modules/module-2/data-types.qmd
          - text: "Vectors"
            href: modules/module-2/vectors.qmd
          - text: "Lists and Data Frames"
            href: modules/module-2/data-structures.qmd
          - text: "Control Structures"
            href: modules/module-2/control-structures.qmd
          - text: "Functions"
            href: modules/module-2/functions.qmd
          - text: "Working with Files"
            href: modules/module-2/working-with-files.qmd

      - section: "Module 3: Introduction to Tidyverse"
