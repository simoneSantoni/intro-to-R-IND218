format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    mainfont: "Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    number-depth: 3
    callout-appearance: simple
    callout-icon: false
    citations-hover: true
    footnotes-hover: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

jupyter:
  kernelspec:
    name: "ir"
    language: "R"
    display_name: "R (ind215)"
